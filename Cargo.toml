[package]
name = "orchard"
description = "The Orchard shielded transaction protocol"
keywords = ["cryptography", "orchard", "zero-knowledge", "zcash"]
categories = ["cryptography::cryptocurrencies"]
exclude = ["/AGENTS.md"]
version = "0.15.5"
authors = [
    "Sean Bowe <ewillbefull@gmail.com>",
    "Jack Grigg <thestr4d@gmail.com>",
    "Daira-Emma Hopwood <daira@jacaranda.org>",
    "Ying Tong Lai",
    "Kris Nuttycombe <kris@nutty.land>",
    "Dev Ojha <ValarDragon@users.noreply.github.com>",
]
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/auzum197/auzum-orchard"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "katex-header.html"]

[lib]
name = "orchard"
bench = false

[dependencies]
aes = "0.8"
bitvec = { version = "1", default-features = false }
blake2b_simd = { version = "1", default-features = false }
corez = { version = "0.1.1", features = ["alloc"], default-features = false }
ff = { version = "0.14", default-features = false }
fpe = { version = "0.6", features = ["alloc"], default-features = false }
getset = "0.1"
group = "0.14"
halo2_gadgets = { package = "zakura-halo2-gadgets", git = "https://github.com/auzum197/halo2.git", rev = "edd368d4d0b703e27e3c115f40a02a5b1759c350", optional = true, default-features = false }
halo2_proofs = { package = "zakura-halo2-proofs", git = "https://github.com/auzum197/halo2.git", rev = "edd368d4d0b703e27e3c115f40a02a5b1759c350", features = ["batch", "floor-planner-v1-legacy-pdqsort"], optional = true, default-features = false }
hex = { version = "0.4", features = ["alloc"], default-features = false }
image = { version = "0.24", optional = true }
incrementalmerkletree = "0.8.1"
memuse = { version = "0.2.2", default-features = false }
maybe-rayon = { version = "0.1.0", default-features = false, optional = true }
nonempty = { version = "0.11", default-features = false }
once_cell = { version = "1", features = ["race", "alloc"], default-features = false }
pasta_curves = { package = "zakura-pasta-curves", git = "https://github.com/zakura-core/common.git", rev = "66ddff6adf11ee134efef0e3e28ac5f72ea92824", features = ["default", "glv"], default-features = false }
plotters = { version = "0.3.0", optional = true }
poseidon = { package = "zakura-halo2-poseidon", git = "https://github.com/auzum197/halo2.git", rev = "edd368d4d0b703e27e3c115f40a02a5b1759c350", default-features = false }
proptest = { version = ">=1.0.0, <1.7.0", optional = true }
rand = { version = "0.10", default-features = false }
rand_core = { version = "0.10", default-features = false }
rand_core_06 = { version = "0.6", default-features = false, package = "rand_core" }
reddsa = { package = "zakura-reddsa", git = "https://github.com/zakura-core/common.git", rev = "66ddff6adf11ee134efef0e3e28ac5f72ea92824", default-features = false }
secp256k1 = { version = "0.29", features = ["alloc", "rand"], optional = true, default-features = false }
serde = { version = "1.0", features = ["derive"], default-features = false }
sinsemilla = { package = "zakura-sinsemilla", git = "https://github.com/zakura-core/common.git", rev = "66ddff6adf11ee134efef0e3e28ac5f72ea92824", default-features = false }
subtle = { version = "2.6", default-features = false }
tracing = { version = "0.1", default-features = false }
visibility = { version = "0.1.1", optional = true }
zcash_note_encryption = { package = "auzum-zcash-note-encryption", git = "https://github.com/auzum197/zcash_note_encryption.git", rev = "c2dba6105908ef9a2e04766cdccac18b0a4a953c" }
zcash_spec = "0.2.1"
zip32 = { version = "0.2.0", default-features = false }

[dev-dependencies]
criterion = "0.4"
halo2_gadgets = { package = "zakura-halo2-gadgets", git = "https://github.com/auzum197/halo2.git", rev = "edd368d4d0b703e27e3c115f40a02a5b1759c350", features = ["test-dependencies"], default-features = false }
hex = "0.4"
incrementalmerkletree = { version = "0.8.1", features = ["test-dependencies"] }
proptest = ">=1.0.0, <1.7.0"
rand = { version = "0.10", features = ["thread_rng"], default-features = false }
rand_chacha = "0.10"
rayon = "1"
shardtree = "0.6"
sinsemilla = { package = "zakura-sinsemilla", git = "https://github.com/zakura-core/common.git", rev = "66ddff6adf11ee134efef0e3e28ac5f72ea92824", features = ["test-dependencies"], default-features = false }
zcash_note_encryption = { package = "auzum-zcash-note-encryption", git = "https://github.com/auzum197/zcash_note_encryption.git", rev = "c2dba6105908ef9a2e04766cdccac18b0a4a953c", features = ["pre-zip-212"] }

[target."cfg(unix)".dev-dependencies]
inferno = { version = "0.11", features = ["multithreaded", "nameattr"], default-features = false }
pprof = { version = "0.11", features = ["criterion", "flamegraph"] }

[features]
circuit = ["dep:halo2_gadgets", "dep:halo2_proofs", "std"]
default = ["circuit", "multicore", "std"]
dev-graph = ["halo2_proofs?/dev-graph", "image", "plotters"]
multicore = ["halo2_proofs?/multicore", "dep:maybe-rayon", "maybe-rayon/threads"]
orbits = ["halo2_proofs?/orbits"]
std = ["corez/std", "group/wnaf-memuse", "reddsa/std"]
test-dependencies = ["proptest", "rand/std", "rand/std_rng"]
unstable-frost = ["dep:visibility"]
unstable-voting-circuits = ["dep:visibility"]
verifier-fingerprint = ["circuit", "halo2_proofs/unstable-verifier-fingerprint"]
# Capture the prover's private tape and complete transcript for formal-model fixtures.
prover-fingerprint = ["circuit", "halo2_proofs/unstable-prover-fingerprint"]
circuit-fixtures = ["circuit", "halo2_proofs/unstable-circuit-fixtures"]
weighted-merkle = []
x86_64-asm = ["pasta_curves/x86_64-asm", "halo2_proofs?/x86_64-asm"]
zsa-issuance = ["dep:secp256k1"]
temporary-zebra = []

[[example]]
name = "generate_lagrange_coeffs"
required-features = ["circuit", "unstable-voting-circuits"]

[[test]]
name = "ironwood_batch_timings"
required-features = ["circuit"]

[[bench]]
name = "circuit"
harness = false
required-features = ["circuit"]

[[bench]]
name = "note_decryption"
harness = false
required-features = ["circuit"]

[[bench]]
name = "small"
harness = false

[[bench]]
name = "merkle"
harness = false

[[bench]]
name = "ironwood_k11_prover"
harness = false
required-features = ["circuit"]

[[bench]]
name = "post_nu6_3_k11_keygen"
harness = false
required-features = ["circuit"]

[profile.release]
debug = true

[profile.bench]
debug = true
